# CyphtWebmail
#
# Goal:    Embed the Cypht webmail client inside Dolibarr, with single sign-on,
#          Dolibarr contacts as an address book and email templates in compose.
# Version: 1.0
# Author:  Copyright 2026 - Camile <camilevahviraki@gmail.com>
# License: GPLv3
# Install: Home - Setup - Modules - Deploy external module, and upload the zip.
# Setup:   Home - Setup - Modules, enable CyphtWebmail, then CyphtWebmail -
#          Module setup.
#
# For the makepack route. build/buildzip.php is what actually cuts a release:
# it exports HEAD, compiles Cypht offline, prunes the ~158 MB the runtime never
# reads, and refuses to emit an archive that fails its own checks. makepack
# copies the working tree as-is and does none of that.
#
# Files in module
cyphtwebmail/
